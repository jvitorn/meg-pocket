name: Launcher Release

on:
  workflow_dispatch:
  push:
    tags:
      - "launcher-v*"

jobs:
  build-linux:
    name: Build Linux Launcher
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Test installer scripts
        run: |
          for file in installers/linux/*.sh installers/bootstrap/*.sh installers/tests/*.sh installers/*.sh; do
            bash -n "$file"
          done
          installers/tests/test-detect-distro.sh
          installers/tests/test-compose-helper.sh
          installers/tests/test-doctor-output.sh

      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci

      - name: Test launcher
        working-directory: launcher
        run: npm test

      - name: Build launcher frontend
        working-directory: launcher
        run: npm run build

      - name: Check Tauri Rust backend
        working-directory: launcher/src-tauri
        run: cargo check

      - name: Build launcher AppImage
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tauriScript: npm run tauri
          args: --bundles appimage,deb
          tagName: launcher-v__VERSION__
          releaseName: "M&G Pocket Launcher v__VERSION__"
          releaseBody: "Build inicial do launcher Linux. Windows e pacotes adicionais entram nas próximas etapas."
          releaseDraft: true
          prerelease: false

      - name: Generate checksums
        if: always()
        run: |
          find launcher/src-tauri/target/release/bundle -type f \( -name "*.AppImage" -o -name "*.deb" \) \
            -exec sha256sum {} \; > checksums.txt || true

      - name: Upload checksums artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: launcher-checksums
          path: checksums.txt
          if-no-files-found: ignore
