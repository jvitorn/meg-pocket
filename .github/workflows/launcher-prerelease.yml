name: Build Launcher Pre-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da pre-release. Ex: v1.1.0-beta.1"
        required: true
        type: string
      draft:
        description: "Criar como draft release"
        required: false
        default: true
        type: boolean
      prerelease:
        description: "Marcar como pre-release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-launcher:
    name: Build ${{ matrix.name }} Launcher
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            artifactName: launcher-linux-checksums
            platform: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
          - name: Windows
            artifactName: launcher-windows-checksums
            platform: windows-latest
            args: "--bundles nsis,msi"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          if [[ "${INPUT_VERSION}" == v* ]]; then
            tag="${INPUT_VERSION}"
          else
            tag="v${INPUT_VERSION}"
          fi

          draft="${INPUT_DRAFT:-true}"
          prerelease="${INPUT_PRERELEASE:-true}"

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "draft=${draft}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust and Tauri
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            launcher/src-tauri/target
          key: tauri-${{ runner.os }}-${{ hashFiles('launcher/src-tauri/Cargo.lock', 'launcher/package-lock.json') }}
          restore-keys: |
            tauri-${{ runner.os }}-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Install launcher dependencies
        working-directory: launcher
        run: npm install

      - name: Fix and validate Tauri icons
        working-directory: launcher
        run: npm run fix:icons

      - name: Run launcher tests
        working-directory: launcher
        run: npm run test

      - name: Build launcher frontend
        working-directory: launcher
        run: npm run build

      - name: Check Tauri Rust backend
        working-directory: launcher/src-tauri
        run: cargo check

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: launcher
          tauriScript: npm run tauri
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: "M&G Pocket Launcher ${{ steps.release.outputs.tag }}"
          releaseBody: |
            Pre-release do M&G Pocket Launcher.

            Inclui builds para Linux e Windows.

            Observações:
            - Linux: use preferencialmente AppImage.
            - Linux também inclui pacotes .deb e .rpm quando o build concluir com sucesso.
            - Windows: o launcher pode instalar Git e Docker Desktop via winget com confirmação.
            - Linux Ubuntu/Debian/Arch-based: o launcher pode ajudar na instalação/validação do Docker.
          releaseDraft: ${{ steps.release.outputs.draft }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          args: ${{ matrix.args }}

      - name: Prepare friendly artifact names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bundle_dir="launcher/src-tauri/target/release/bundle"

          if [ "${{ matrix.name }}" = "Linux" ]; then
            appimage="$(find "$bundle_dir" -type f -name '*.AppImage' | head -n 1 || true)"
            deb="$(find "$bundle_dir" -type f -name '*.deb' | head -n 1 || true)"
            rpm="$(find "$bundle_dir" -type f -name '*.rpm' | head -n 1 || true)"
            [ -n "$appimage" ] && cp "$appimage" release-assets/MG-Pocket-Launcher-Linux.AppImage
            [ -n "$deb" ] && cp "$deb" release-assets/MG-Pocket-Launcher-Linux.deb
            [ -n "$rpm" ] && cp "$rpm" release-assets/MG-Pocket-Launcher-Linux.rpm
          else
            setup="$(find "$bundle_dir" -type f -iname '*.exe' | head -n 1 || true)"
            [ -n "$setup" ] && cp "$setup" release-assets/MG-Pocket-Launcher-Windows-Setup.exe
          fi

          if ! find release-assets -type f | grep -q .; then
            echo "Nenhum artefato amigável encontrado para ${{ matrix.name }}."
            find "$bundle_dir" -type f || true
            exit 1
          fi

      - name: Attach friendly artifacts to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag }}" release-assets/* --clobber

      - name: Generate checksums
        shell: bash
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum release-assets/* > "checksums-${{ matrix.artifactName }}.txt"
          else
            shasum -a 256 release-assets/* > "checksums-${{ matrix.artifactName }}.txt"
          fi

      - name: Upload checksums artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactName }}
          path: checksums-${{ matrix.artifactName }}.txt
          if-no-files-found: error
