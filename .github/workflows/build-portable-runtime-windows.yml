name: Build Portable Runtime Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release/runtime version. Example: v1.1.0"
        required: true
        type: string
      runtime_tag_prefix:
        description: "Technical runtime release tag prefix."
        required: false
        default: "portable-runtime"
        type: string
      postgres_zip_url:
        description: "Optional Windows x64 PostgreSQL ZIP override. Defaults to EDB PostgreSQL 16.14 binaries."
        required: false
        type: string
  push:
    tags:
      - "portable-runtime-v*.*.*"

permissions:
  contents: write

jobs:
  build-portable-runtime:
    name: Windows x64 Portable Runtime
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: pwsh
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_RUNTIME_TAG_PREFIX: ${{ github.event.inputs.runtime_tag_prefix }}
        run: |
          $prefix = $env:INPUT_RUNTIME_TAG_PREFIX
          if (-not $prefix) { $prefix = "portable-runtime" }

          $version = $env:INPUT_VERSION
          if (-not $version) { $version = "${{ github.ref_name }}" }
          if ($version.StartsWith("$prefix-")) {
            $version = $version.Substring($prefix.Length + 1)
          }
          if (-not $version.StartsWith("v")) { $version = "v$version" }

          $runtimeTag = "$prefix-$version"
          $plain = $version -replace '^v', ''

          "version=$version" >> $env:GITHUB_OUTPUT
          "plain=$plain" >> $env:GITHUB_OUTPUT
          "runtime_tag=$runtimeTag" >> $env:GITHUB_OUTPUT
          "runtime_tag_prefix=$prefix" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build portable runtime package
        id: package
        shell: pwsh
        env:
          INPUT_POSTGRES_ZIP_URL: ${{ github.event.inputs.postgres_zip_url }}
          VAR_POSTGRES_ZIP_URL: ${{ vars.POSTGRES_WINDOWS_ZIP_URL }}
        run: |
          $scriptArgs = @(
            "-Version", "${{ steps.release.outputs.version }}",
            "-OutputDir", "portable-runtime-dist",
            "-RuntimeTagPrefix", "${{ steps.release.outputs.runtime_tag_prefix }}"
          )

          $postgresZipUrl = $env:INPUT_POSTGRES_ZIP_URL
          if (-not $postgresZipUrl) { $postgresZipUrl = $env:VAR_POSTGRES_ZIP_URL }
          if ($postgresZipUrl) { $scriptArgs += @("-PostgresZipUrl", $postgresZipUrl) }

          & ./scripts/build-portable-runtime-windows.ps1 @scriptArgs

          $zipFile = "portable-runtime-dist/meg-pocket-portable-runtime-windows-x64-${{ steps.release.outputs.version }}.zip"
          $manifestFile = "portable-runtime-dist/portable-manifest.json"
          if (-not (Test-Path $zipFile)) { Write-Error "Missing runtime ZIP: $zipFile"; exit 1 }
          if (-not (Test-Path $manifestFile)) { Write-Error "Missing portable manifest: $manifestFile"; exit 1 }

          "file=$zipFile" >> $env:GITHUB_OUTPUT
          "manifest=$manifestFile" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-runtime-windows-x64
          path: |
            ${{ steps.package.outputs.file }}
            ${{ steps.package.outputs.manifest }}
          if-no-files-found: error

      - name: Publish to technical runtime release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.release.outputs.runtime_tag }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            $notes = @"
          Release tecnica do runtime portatil Windows x64.

          Esta release contem apenas assets consumidos pelo launcher. A release final do launcher continua separada.
          "@
            gh release create $tag --title "M&G Pocket Portable Runtime ${{ steps.release.outputs.version }}" --latest=false --notes $notes
          }
          gh release upload $tag "${{ steps.package.outputs.file }}" "${{ steps.package.outputs.manifest }}" --clobber
          gh release edit $tag --latest=false
