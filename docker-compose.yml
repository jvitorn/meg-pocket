services:
  postgres:
    image: postgres:16-alpine
    container_name: meg-pocket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meg_pocket
      POSTGRES_USER: meg
      POSTGRES_PASSWORD: meg
    ports:
      - "5433:5432"
    volumes:
      - meg-pocket-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meg -d meg_pocket"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    image: nginx:1.29-alpine
    container_name: meg-pocket-storage
    restart: unless-stopped
    ports:
      - "9323:80"
    volumes:
      - ./storage/local/public:/usr/share/nginx/html:ro

  adminer:
    image: adminer:4.8.1
    container_name: meg-pocket-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  meg-pocket-postgres-data:
